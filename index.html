<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PalletCalc Export</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      background:#111827;
      color:white;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:600px;
      background:#1f2937;
      padding:30px;
      border-radius:20px;
      box-shadow:0 0 25px rgba(0,0,0,0.4);
    }

    .titulo{
      text-align:center;
      margin-bottom:30px;
    }

    .titulo h1{
      font-size:32px;
      margin-bottom:10px;
      color:#22c55e;
    }

    .titulo p{
      color:#9ca3af;
      font-size:15px;
    }

    label{
      display:block;
      margin-top:20px;
      margin-bottom:8px;
      font-weight:bold;
      color:#d1d5db;
    }

    select,
    input{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#374151;
      color:white;
      font-size:16px;
      outline:none;
    }

    select:focus,
    input:focus{
      border:2px solid #22c55e;
    }

    button{
      width:100%;
      margin-top:20px;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#22c55e;
      color:white;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#16a34a;
    }

    .cards{
      margin-top:30px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .card{
      background:#374151;
      padding:20px;
      border-radius:16px;
      text-align:center;
    }

    .card h2{
      font-size:15px;
      color:#9ca3af;
      margin-bottom:10px;
    }

    .valor{
      font-size:32px;
      font-weight:bold;
      color:#22c55e;
    }

    .erro{
      margin-top:20px;
      background:#7f1d1d;
      padding:15px;
      border-radius:12px;
      color:#fecaca;
      text-align:center;
      font-weight:bold;
    }

    .historico{
      margin-top:35px;
    }

    .historico h2{
      margin-bottom:15px;
      color:#22c55e;
    }

    .item-historico{
      background:#374151;
      padding:15px;
      border-radius:12px;
      margin-bottom:10px;
      border-left:5px solid #22c55e;
      line-height:1.7;
    }

    .hora{
      color:#9ca3af;
      font-size:13px;
    }

    .footer{
      margin-top:30px;
      text-align:center;
      color:#6b7280;
      font-size:14px;
    }

    @media(max-width:500px){

      .cards{
        grid-template-columns:1fr;
      }

      .valor{
        font-size:28px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <div class="titulo">
      <h1>📦 PalletCalc Export</h1>
      <p>Sistema de cálculo logístico de pallets</p>
    </div>

    <label>🌎 Mercado</label>

    <select id="mercado">

      <option value="280|14|🇺🇸 Estados Unidos — 4 kg">
        🇺🇸 Estados Unidos — 4 kg
      </option>

      <option value="360|5|🇺🇸 Estados Unidos — 2,5 kg|2.5">
        🇺🇸 Estados Unidos — 2,5 kg
      </option>

      <option value="95|5|🇺🇸 Estados Unidos — 11 kg">
        🇺🇸 Estados Unidos — 11 kg
      </option>

      <option value="252|12|🇪🇺 Europa — 4 kg">
        🇪🇺 Europa — 4 kg
      </option>

      <option value="216|12|🇨🇱 Chile — 4 kg">
        🇨🇱 Chile — 4 kg
      </option>

      <option value="216|12|🇦🇷 Argentina — 4 kg">
        🇦🇷 Argentina — 4 kg
      </option>

      <option value="60|6|🇧🇷 Mercado Interno — 18 kg">
        🇧🇷 Mercado Interno — 18 kg
      </option>

      <option value="54|6|🇦🇷 Argentina — 18 kg">
        🇦🇷 Argentina — 18 kg
      </option>

    </select>

    <label>❄️ Sobra na Câmara</label>

    <input
      type="number"
      id="sobra"
      placeholder="Digite a quantidade"
    >

    <button onclick="calcular()">
      Calcular
    </button>

    <div id="erro"></div>

    <div class="cards">

      <div class="card">

        <h2>📦 Parcial Necessária</h2>

        <div class="valor" id="parcial">
          --
        </div>

      </div>

      <div class="card">

        <h2>📊 Altura</h2>

        <div class="valor" id="altura">
          --
        </div>

      </div>

      <div class="card" id="cardMontagem" style="display:none;">

        <h2>📋 Observação</h2>

        <div class="valor" id="montagem" style="font-size:18px; line-height:1.5;">
        --
        </div>

      </div>

    </div>

    <div class="historico">

      <h2>🕘 Histórico</h2>

      <div id="listaHistorico">

      </div>

    </div>

    <div class="footer">
      Sistema de Controle de Pallets
      <br>
      Desenvolvido por Carlos Rodrigues
    </div>

  </div>

  <script>

    let historico = [];

    function calcular(){

      let mercado =
        document.getElementById("mercado").value;

      let sobraInput =
        document.getElementById("sobra").value;

      let erro =
        document.getElementById("erro");

      erro.innerHTML = "";

      // VALIDAÇÃO
      if(
        mercado === "" ||
        sobraInput === ""
      ){

        erro.innerHTML = `
          <div class="erro">
            Preencha todos os campos.
          </div>
        `;

        return;
      }

      let sobra = Number(sobraInput);

      // DADOS
      let dados = mercado.split("|");

      let palletCompleto =
        Number(dados[0]);

      let caixasPorBase =
        Number(dados[1]);

      let nomeMercado =
        dados[2];

      let tipo = dados[3] || "normal";

      // VALIDAÇÕES
      if(sobra < 0){

        erro.innerHTML = `
          <div class="erro">
            Digite um valor válido.
          </div>
        `;

        return;
      }

      if(sobra > palletCompleto){

        erro.innerHTML = `
          <div class="erro">
            A sobra não pode ser maior que
            ${palletCompleto} caixas.
          </div>
        `;

        return;
      }

      //=========================
      // CÁLCULO DA PARCIAL
      //=========================

      let parcial = palletCompleto - sobra;

      let altura = "";

      // Variáveis extras (2,5kg)
      let caixasMaiores = 0;
      let completas = 0;
      let ultimaCaixa = 0;

      if(tipo === "2.5"){

        // Cada caixa maior possui 8 caixas de 2,5kg

        caixasMaiores = Math.ceil(parcial / 8);

        completas = Math.floor(parcial / 8) 

        ultimaCaixa = parcial % 8;

        let camadas = Math.floor(caixasMaiores / 5);

        let resto = caixasMaiores % 5;

        if(resto === 0){
          altura = camadas;
        }else{
          altura = `${camadas} + ${resto}`;
        }

      }else{

          let camadas =
            Math.floor(parcial / caixasPorBase);

          let resto =
            parcial % caixasPorBase;

          if(resto === 0){
            altura = camadas;
          }else{
            altura = `${camadas} + ${resto}`;
          }

      }

      // MOSTRA RESULTADOS

      let cardMontagem = document.getElementById("cardMontagem");
      let montagem = document.getElementById("montagem");

      if(tipo === "2.5"){

        // Card Parcial
        document.getElementById("parcial").innerHTML =
          `${parcial}<br><span style="font-size:18px;">caixas de 2,5 kg</span>`;

        // Card Observação
        if(ultimaCaixa > 0){

          cardMontagem.style.display = "block";

          montagem.innerHTML = `
            Deixar a última caixa
            <br>
            com <strong>${ultimaCaixa} caixas de 2,5 kg</strong>.
          `;

        }else{

          cardMontagem.style.display = "none";

        } 

      }else{

        // Esconde o card para todos os outros mercados
        cardMontagem.style.display = "none";

        document.getElementById("parcial").innerHTML = parcial;

      }

      document.getElementById("altura").innerHTML = altura;

      // HORA
      let agora = new Date();

      let hora =
        agora.toLocaleTimeString("pt-BR");

      // HISTÓRICO
      let registro = `
        <div class="item-historico">

          <strong>${nomeMercado}</strong>

          <div class="hora">
            ${hora}
          </div>

          ❄️ Sobra: ${sobra} caixas<br>

          📦 Parcial: ${parcial} caixas<br>

          📊 Altura: ${altura}

        </div>
      `;

      historico.unshift(registro);

      // LIMITA HISTÓRICO
      if(historico.length > 5){
        historico.pop();
      }

      document.getElementById("listaHistorico")
        .innerHTML = historico.join("");
    }

    // ENTER EXECUTA O CÁLCULO
    document.addEventListener("keydown", function(event){

      if(event.key === "Enter"){
        calcular();
      }

    });

  </script>

</body>

</html>
